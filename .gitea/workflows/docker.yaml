name: Build and push SSK's container image
run-name: ${{ gitea.actor }} is building and pushing SSK's container image
on: create

jobs:
  build-and-push-image:
    runs-on: builder-debian-12
    container:
      image: ghcr.io/catthehacker/ubuntu:act-latest
    steps:
      - uses: homelab/workflows/.gitea/workflows/docker.yaml@main
        with:
          image-owner: pg
          image-name: spotify-swiss-knife
        secrets: inherit
